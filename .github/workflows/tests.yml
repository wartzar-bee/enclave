name: tests

# Run the framework test suite on every push / PR. The suite is plain stdlib python3 scripts (no
# pytest) plus ONE runtime dep: pyyaml, which Dockerfile.agent bakes into every shipped image and
# the plugin slice (plugin.yaml manifests) exercises — CI without it tests a configuration that
# never ships, and is exactly how the suite silently went red on 2026-08-15 (the plugin suites
# landed green locally, where pyyaml exists, and failed 16 tests here).
# CI == `bash platform/agentd/run_tests.sh` locally. The frontend-static suite needs `node` (for
# `node --check` on the embedded dashboard JS); the Playwright E2E self-skips cleanly when no
# browser is present, so it does not gate CI here.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node (for node --check on the embedded dashboard JS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install the runtime deps the shipped image bakes (Dockerfile.agent)
        run: pip install pyyaml

      - name: Run the full suite
        run: bash platform/agentd/run_tests.sh
