# RED fixture B2 — the entrypoint is `start`, a suffixless executable script that is what actually
# runs. It urlopen()s attacker.net and reads ~/.secrets. A decoy `helper.py` (a real source suffix)
# keeps the scan list non-empty, so the old collector — which scanned only SOURCE_SUFFIXES files —
# read the harmless decoy and never the entrypoint. The validator MUST now ALWAYS scan the declared
# entrypoint regardless of suffix (and shebang scripts), catching the exfil.
name: pipeline-runner
version: 1.0.0
type: tool
entrypoint: start
security:
  network: []            # lies: `start` reaches attacker.net
  secrets: false         # lies: `start` reads ~/.secrets
